            background-repeat: repeat; /* Lặp ảnh cho phủ kín màn hình */
            opacity: 0.12; /* Độ mờ 12% để không làm chói mắt */
            z-index: -1;
        }
        .login-card {
            background: #111111;
            padding: 44px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            border: 1px solid #222222;
            border-radius: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            margin-bottom: 12px;
        }
        .user-badge {
            background: #222222;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 13px;
            color: #aaaaaa;
            border: 1px solid #333333;
            margin-bottom: 24px;
        }
        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 20px 0;
            text-align: center;
            color: #ffffff;
        }
        .input-group {
            width: 100%;
            margin-bottom: 24px;
        }
        input#passcode {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #444444;
            border-bottom: 2px solid #444444;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
            transition: border-bottom-color 0.2s;
            letter-spacing: 2px;
        }
        input#passcode::placeholder {
            letter-spacing: normal;
            color: #666666;
        }
        input#passcode:focus {
            border-bottom-color: #0067b8;
        }
        input#passcode.error {
            border-bottom-color: #e81123;
        }
        #error {
            color: #e81123;
            font-size: 13px;
            margin-top: 8px;
            display: none;
        }
        button#unlockBtn {
            width: 100%;
            background-color: #0067b8;
            color: white;
            border: none;
            padding: 10px;
            font-size: 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 400;
            transition: background-color 0.2s;
        }
        button#unlockBtn:hover:not(:disabled) {
            background-color: #005da6;
        }
        button#unlockBtn:disabled {
            background-color: #0067b8;
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img class="logo" src="https://images-ext-1.discordapp.net/external/8V_oBQhKYd3HhzElJ3OGInU_gHstujvv03RNIh09oe8/%3Fsize%3D4096/https/cdn.discordapp.com/icons/1527665587952549938/a_d7cba992595464edd5294c5f19640f16.gif" alt="Aniko Logo">
        <div class="user-badge">aniko-sito@transcript.vault</div>
        <h2>Nhập mật khẩu</h2>

        <div class="input-group">
            <!-- type="password" để che dấu chấm tròn -->
            <input id="passcode" type="password" autocomplete="off" spellcheck="false" placeholder="Mật khẩu" autofocus>
            <div id="error">Mật khẩu không chính xác. Vui lòng thử lại.</div>
        </div>

        <button id="unlockBtn" disabled>Tiếp theo</button>
    </div>

    <script>
        const input = document.getElementById('passcode');
        const errorEl = document.getElementById('error');
        const btn = document.getElementById('unlockBtn');
        const payload = JSON.parse(document.getElementById('vault-payload').textContent);

        function clearError() {
            input.classList.remove('error');
            errorEl.style.display = 'none';
        }

        input.addEventListener('input', () => {
            clearError();
            // Nút bấm chỉ khoá khi ô nhập liệu trống, không giới hạn độ dài nữa
            btn.disabled = input.value.trim().length === 0;
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && input.value.trim().length > 0) decrypt();
        });
        btn.addEventListener('click', decrypt);

        function decrypt() {
            try {
                // Tự động chuyển input ngầm thành chữ hoa để giải mã chính xác
                const pass = input.value.trim().toUpperCase();
                const key = CryptoJS.SHA256(pass);
                const iv = CryptoJS.enc.Hex.parse(payload.iv);
                const decrypted = CryptoJS.AES.decrypt(payload.ct, key, { iv: iv });
                const html = decrypted.toString(CryptoJS.enc.Utf8);
                if (!html) throw new Error('empty');
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                errorEl.style.display = 'block';
                input.classList.add('error');

                // Hiệu ứng rung nhẹ khi sai mật khẩu
                input.style.transform = 'translateX(-4px)';
                setTimeout(() => input.style.transform = 'translateX(4px)', 50);
                setTimeout(() => input.style.transform = 'translateX(-4px)', 100);
                setTimeout(() => input.style.transform = 'translateX(4px)', 150);
                setTimeout(() => input.style.transform = 'translateX(0)', 200);
            }
        }
    </script>
</body>
</html>
