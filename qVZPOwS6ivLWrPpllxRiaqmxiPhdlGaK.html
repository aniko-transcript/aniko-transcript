<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bản ghi riêng tư | Aniko Sì To</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 0%, #23233a 0%, #0a0a12 55%, #000000 100%);
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .header {
            text-align: center;
            margin-bottom: 34px;
        }
        .lock-icon {
            font-size: 30px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(88, 101, 242, 0.55));
        }
        h2 {
            font-size: 21px;
            font-weight: 600;
            margin: 0 0 6px 0;
            letter-spacing: 0.3px;
        }
        .brand {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.2px;
            color: rgba(255, 255, 255, 0.45);
            text-transform: uppercase;
        }
        .dots-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 44px;
            height: 16px;
        }
        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-sizing: border-box;
            transition: all 0.15s ease;
        }
        .dot.filled {
            background: linear-gradient(135deg, #5865F2, #7289DA);
            border-color: #5865F2;
            box-shadow: 0 0 10px rgba(88, 101, 242, 0.7);
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 74px);
            gap: 18px 24px;
            justify-content: center;
        }
        .num-btn {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 30px;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .num-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .num-btn:active {
            background: rgba(88, 101, 242, 0.35);
            transform: scale(0.94);
        }
        .num-btn span {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.4px;
            margin-top: -2px;
            color: rgba(255, 255, 255, 0.5);
        }
        .action-btn {
            width: 74px;
            height: 74px;
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.75);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }
        .action-btn:active {
            opacity: 0.5;
        }
        #error {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: -26px;
            margin-bottom: 26px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-9px); }
            40%, 80% { transform: translateX(9px); }
        }
        .shake {
            animation: shake 0.4s ease;
        }
        .shake .dot {
            border-color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="lock-icon">🔒</div>
        <h2>Nhập Mật Mã</h2>
        <div class="brand">Aniko Sì To • Bản Ghi Bảo Mật</div>
    </div>

    <div id="error">Mật mã không chính xác</div>

    <div class="dots-container" id="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="numpad">
        <button class="num-btn" onclick="press('1')">1</button>
        <button class="num-btn" onclick="press('2')">2<span>ABC</span></button>
        <button class="num-btn" onclick="press('3')">3<span>DEF</span></button>
        <button class="num-btn" onclick="press('4')">4<span>GHI</span></button>
        <button class="num-btn" onclick="press('5')">5<span>JKL</span></button>
        <button class="num-btn" onclick="press('6')">6<span>MNO</span></button>
        <button class="num-btn" onclick="press('7')">7<span>PQRS</span></button>
        <button class="num-btn" onclick="press('8')">8<span>TUV</span></button>
        <button class="num-btn" onclick="press('9')">9<span>WXYZ</span></button>
        <button class="action-btn" onclick="clearAll()">Hủy</button>
        <button class="num-btn" onclick="press('0')">0</button>
        <button class="action-btn" onclick="deleteLast()">Xóa</button>
    </div>

    <script>
        let passcode = "";
        const MAX_LEN = 8;
        const dots = document.querySelectorAll('.dot');
        const errorEl = document.getElementById('error');
        const dotsContainer = document.getElementById('dots');

        function updateDots() {
            dots.forEach((dot, index) => {
                dot.classList.toggle('filled', index < passcode.length);
            });
        }

        function press(num) {
            errorEl.style.opacity = '0';
            if (passcode.length < MAX_LEN) {
                passcode += num;
                updateDots();
                if (passcode.length === MAX_LEN) {
                    setTimeout(decrypt, 150);
                }
            }
        }

        function deleteLast() {
            passcode = passcode.slice(0, -1);
            updateDots();
        }

        function clearAll() {
            passcode = "";
            updateDots();
        }
