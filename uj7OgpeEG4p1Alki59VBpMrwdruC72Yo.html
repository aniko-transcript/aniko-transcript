<body>
    <div class="vault-card" id="card">
        <div class="top-accent"></div>
        <div class="card-body">
            <div class="logo-wrap">
                <div class="logo-ring">
                    <img class="logo" src="https://cdn.discordapp.com/icons/1527665587952549938/a_d7cba992595464edd5294c5f19640f16.gif?size=128" alt="Aniko Logo">
                </div>
                <div class="lock-badge">🔒</div>
            </div>
            <div class="user-badge">
                <span class="status-dot"></span>
                <span>aniko-sito@transcript.vault</span>
            </div>
            <h2>Mở Khoá Bản Ghi Giao Dịch</h2>
            <p class="subtitle">
                Nhập mã bảo mật gồm <strong>6 ký tự</strong> được gửi kèm link để giải mã nội dung cuộc trò chuyện.
            </p>

            <div class="field-box">
                <div class="field-label">
                    <span>Mã khoá bảo mật</span>
                    <span class="char-count" id="charCount">0 / 6 ký tự</span>
                </div>
                <div class="input-wrapper">
                    <input id="passcode" type="password" autocomplete="off" spellcheck="false" placeholder="Nhập mật khẩu" autofocus>
                    <button type="button" class="toggle-btn" id="toggleEye">Hiện</button>
                </div>
                <div id="error">Mật khẩu không chính xác. Vui lòng kiểm tra và thử lại.</div>
                <button id="unlockBtn" disabled>Giải Mã Bản Ghi →</button>
            </div>

            <div class="vault-footer">
                <span>Aniko Sì To • Ticket System</span>
                <span class="cipher-tag">AES-256-CBC</span>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('passcode');
        const errorEl = document.getElementById('error');
        const btn = document.getElementById('unlockBtn');
        const toggleEye = document.getElementById('toggleEye');
        const charCount = document.getElementById('charCount');
        const card = document.getElementById('card');
        const payload = JSON.parse(document.getElementById('vault-payload').textContent);

        function clearError() {
            input.classList.remove('error');
            errorEl.style.display = 'none';
        }

        toggleEye.addEventListener('click', () => {
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            toggleEye.textContent = isPassword ? 'Ẩn' : 'Hiện';
            input.focus();
        });

        input.addEventListener('input', () => {
            clearError();
            const len = input.value.trim().length;
            charCount.textContent = len + ' / 6 ký tự';
            btn.disabled = len === 0;
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && input.value.trim().length > 0) decrypt();
        });
        btn.addEventListener('click', decrypt);

        function decrypt() {
            try {
                const pass = input.value.trim().toUpperCase();
                const key = CryptoJS.SHA256(pass);
                const iv = CryptoJS.enc.Hex.parse(payload.iv);
                const decrypted = CryptoJS.AES.decrypt(payload.ct, key, { iv: iv });
                const html = decrypted.toString(CryptoJS.enc.Utf8);
                if (!html) throw new Error('empty');
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                errorEl.style.display = 'block';
                input.classList.add('error');
                card.style.transform = 'translateX(-5px)';
                setTimeout(() => card.style.transform = 'translateX(5px)', 50);
                setTimeout(() => card.style.transform = 'translateX(-4px)', 100);
                setTimeout(() => card.style.transform = 'translateX(4px)', 150);
                setTimeout(() => card.style.transform = 'translateX(0)', 200);
            }
        }
    </script>
</body>
</html>
