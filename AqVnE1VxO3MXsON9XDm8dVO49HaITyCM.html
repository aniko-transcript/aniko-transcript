    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 50% 0%, #1C1712 0%, #0E0D0C 60%, #080706 100%);
            color: #EDE8E0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .lock-icon { font-size: 26px; margin-bottom: 18px; opacity: 0.85; }
        h2 {
            font-family: 'Fraunces', serif;
            font-size: 24px;
            font-weight: 500;
            margin: 0 0 8px 0;
            letter-spacing: 0.3px;
        }
        .brand {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.4px;
            color: #8C8378;
        }
        .brand-sub { font-size: 11px; color: #6B645A; margin: 2px 0 42px 0; }
        .field { width: 260px; }
        input#passcode {
            width: 100%;
            background: #1C1917;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #EDE8E0;
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5em;
            text-align: center;
            text-transform: uppercase;
            padding: 16px 10px 16px 18px;
            outline: none;
            transition: border-color 0.2s ease;
        }
        input#passcode::placeholder { color: #3A362F; letter-spacing: 0.4em; }
        input#passcode:focus { border-color: rgba(176, 141, 87, 0.6); }
        input#passcode.error { border-color: rgba(220, 80, 80, 0.7); }
        #error {
            color: #E17575;
            font-size: 12.5px;
            margin-top: 14px;
            height: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        button#unlockBtn {
            margin-top: 22px;
            width: 100%;
            padding: 13px;
            background: #B08D57;
            border: none;
            border-radius: 4px;
            color: #0E0D0C;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s ease, opacity 0.2s ease;
        }
        button#unlockBtn:hover:not(:disabled) { background: #C2A06A; }
        button#unlockBtn:disabled { opacity: 0.35; cursor: not-allowed; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s ease; }
    </style>
</head>
<body>
    <div class="lock-icon">🔒</div>
    <h2>Nhập Mã Bảo Mật</h2>
    <div class="brand">Aniko Sì To</div>
    <div class="brand-sub">Bản ghi riêng tư</div>

    <div class="field">
        <input id="passcode" type="text" maxlength="6" autocomplete="off" spellcheck="false" placeholder="——————" autofocus>
        <div id="error">Mã bảo mật không chính xác</div>
        <button id="unlockBtn" disabled>Mở Khoá</button>
    </div>

    <script>
        const input = document.getElementById('passcode');
        const errorEl = document.getElementById('error');
        const btn = document.getElementById('unlockBtn');
        const payload = JSON.parse(document.getElementById('vault-payload').textContent);

        function clearError() {
            input.classList.remove('error');
            errorEl.style.opacity = '0';
        }

        input.addEventListener('input', () => {
            input.value = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
            clearError();
            btn.disabled = input.value.length !== 6;
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && input.value.length === 6) decrypt();
        });
        btn.addEventListener('click', decrypt);

        function decrypt() {
            try {
                const key = CryptoJS.SHA256(input.value);
                const iv = CryptoJS.enc.Hex.parse(payload.iv);
                const decrypted = CryptoJS.AES.decrypt(payload.ct, key, { iv: iv });
                const html = decrypted.toString(CryptoJS.enc.Utf8);
                if (!html) throw new Error('empty');
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                errorEl.style.opacity = '1';
                input.classList.add('error', 'shake');
                setTimeout(() => input.classList.remove('shake'), 400);
            }
        }
    </script>
</body>
</html>
